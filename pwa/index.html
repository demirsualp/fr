<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
<title>YKS Çalışma Takip · Hedefe Doğru</title>
<!-- Android/iOS ana ekrana eklenince tam ekran "uygulama" gibi açılması için -->
<meta name="theme-color" content="#0d1117" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="YKS Takip" />
<meta name="application-name" content="YKS Takip" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
/* ============================================================
   TEMA & DEĞİŞKENLER
   ============================================================ */
:root{
  --bg:#0d1117; --bg-2:#161b22; --bg-3:#1c2330; --bg-elev:#21262d;
  --border:#2d333b; --border-soft:#22272e;
  --text:#e6edf3; --text-dim:#9aa7b4; --text-faint:#6e7b8a;
  --accent:#4f8cff; --accent-2:#7c5cff; --accent-soft:rgba(79,140,255,.14);
  --green:#3fb950; --green-soft:rgba(63,185,80,.16);
  --red:#f85149; --red-soft:rgba(248,81,73,.15);
  --yellow:#d6a01a; --yellow-soft:rgba(214,160,26,.16);
  --purple:#a371f7; --orange:#f0883e; --pink:#db61a2; --cyan:#39c5cf;
  --shadow:0 8px 30px rgba(0,0,0,.35);
  --radius:14px; --radius-sm:10px;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="light"]{
  --bg:#f4f6fa; --bg-2:#ffffff; --bg-3:#eef1f6; --bg-elev:#ffffff;
  --border:#dce1e8; --border-soft:#e7ebf1;
  --text:#1b2330; --text-dim:#56616e; --text-faint:#8a96a3;
  --accent:#2f6bdf; --accent-2:#6b46e0; --accent-soft:rgba(47,107,223,.10);
  --green:#1a7f37; --green-soft:rgba(26,127,55,.12);
  --red:#cf222e; --red-soft:rgba(207,34,46,.10);
  --yellow:#9a6700; --yellow-soft:rgba(154,103,0,.12);
  --shadow:0 8px 30px rgba(20,30,50,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;}
html,body{margin:0;padding:0;max-width:100%;}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  min-height:100vh; transition:background .25s,color .25s;
  overflow-x:hidden; /* yatay taşmayı engelle */
}
a{color:var(--accent);text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
input,select,textarea{
  font-family:inherit;font-size:14px;background:var(--bg-3);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;outline:none;
  transition:border-color .15s,box-shadow .15s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
label{font-size:12.5px;color:var(--text-dim);display:block;margin-bottom:5px;font-weight:500;}
.field{margin-bottom:13px;}

/* ============================================================
   DÜZEN / LAYOUT
   ============================================================ */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:230px;background:var(--bg-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:60;
  transition:transform .25s;
}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-soft);}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;flex-shrink:0;}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;}
.brand small{display:block;color:var(--text-faint);font-size:11px;font-weight:500;}
.nav{flex:1;overflow-y:auto;padding:10px 10px;}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;background:transparent;border:none;
  color:var(--text-dim);padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;
  font-weight:500;margin-bottom:2px;transition:background .15s,color .15s;text-align:left;
}
.nav button .ic{width:20px;text-align:center;font-size:16px;flex-shrink:0;}
.nav button:hover{background:var(--bg-3);color:var(--text);}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav .nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  padding:1px 7px;border-radius:20px;min-width:18px;text-align:center;}
.sidebar-foot{padding:12px;border-top:1px solid var(--border-soft);}
.streak-pill{display:flex;align-items:center;gap:8px;background:var(--bg-3);border-radius:var(--radius-sm);
  padding:9px 11px;font-size:12.5px;color:var(--text-dim);}
.streak-pill .fire{font-size:18px;}
.streak-pill b{color:var(--text);font-size:15px;}

.main{flex:1;margin-left:230px;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;gap:12px;padding:13px 22px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg-2) 80%,transparent);position:sticky;top:0;z-index:40;
  backdrop-filter:blur(10px);
}
.topbar h2{font-size:18px;margin:0;font-weight:700;}
.topbar .spacer{flex:1;}
.menu-btn{display:none;background:var(--bg-3);border:1px solid var(--border);color:var(--text);
  width:38px;height:38px;border-radius:10px;font-size:18px;}
.content{padding:22px;max-width:1240px;width:100%;margin:0 auto;}

/* Düğmeler */
.btn{background:var(--bg-3);border:1px solid var(--border);color:var(--text);padding:9px 14px;
  border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;
  gap:7px;transition:background .15s,border-color .15s,transform .05s;width:auto;}
.btn:hover{background:var(--bg-elev);border-color:var(--accent);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#fff;}
.btn.primary:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--red);border-color:var(--red-soft);}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red);}
.btn.sm{padding:6px 10px;font-size:12px;}
.btn.icon{width:34px;height:34px;padding:0;justify-content:center;}
.icon-btn{background:transparent;border:none;color:var(--text-faint);font-size:15px;padding:5px;border-radius:7px;}
.icon-btn:hover{background:var(--bg-3);color:var(--text);}

/* Kart */
.card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.card.pad-sm{padding:14px;}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.card-h h3{margin:0;font-size:15px;font-weight:700;}
.card-h .spacer{flex:1;}
.grid{display:grid;gap:16px;}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}
.tiny{font-size:12px;}
.row{display:flex;gap:10px;align-items:center;}
.wrap{flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:30px;font-size:11.5px;font-weight:600;}
.tag{display:inline-block;padding:2px 9px;border-radius:7px;font-size:11px;font-weight:600;}

/* Stat kutuları */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.stat{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;}
.stat .lab{font-size:12px;color:var(--text-dim);font-weight:600;display:flex;align-items:center;gap:7px;}
.stat .val{font-size:27px;font-weight:800;margin-top:7px;letter-spacing:-.5px;}
.stat .sub{font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.stat .ic-bg{position:absolute;right:-6px;top:-6px;font-size:46px;opacity:.07;}

/* Progress bar */
.bar{height:9px;background:var(--bg-3);border-radius:20px;overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s;}
.bar.green > i{background:linear-gradient(90deg,var(--green),#56d364);}
.bar.yellow > i{background:linear-gradient(90deg,var(--yellow),#e3b341);}

/* Tablo */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--text-dim);font-weight:600;font-size:12px;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px;border-bottom:1px solid var(--border-soft);}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
.modal-bg.open{display:flex;}
.modal{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:520px;box-shadow:var(--shadow);animation:pop .18s ease;}
.modal.wide{max-width:760px;}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
.modal-h{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);}
.modal-h h3{margin:0;font-size:16px;}
.modal-b{padding:18px;max-height:70vh;overflow-y:auto;}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:520px){.grid-2{grid-template-columns:1fr;}}

/* Toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px;}
.toast{background:var(--bg-elev);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;
  padding:11px 15px;font-size:13.5px;box-shadow:var(--shadow);animation:slideIn .25s;max-width:330px;}
.toast.ok{border-left-color:var(--green);}
.toast.warn{border-left-color:var(--yellow);}
.toast.err{border-left-color:var(--red);}
@keyframes slideIn{from{transform:translateX(40px);opacity:0;}to{transform:none;opacity:1;}}

/* Sekme / segmented */
.seg{display:inline-flex;background:var(--bg-3);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;}
.seg button{background:transparent;border:none;color:var(--text-dim);padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;}
.seg button.active{background:var(--accent);color:#fff;}

/* Durum renkleri */
.st-islenmedi{background:var(--bg-3);color:var(--text-dim);}
.st-calisiliyor{background:var(--accent-soft);color:var(--accent);}
.st-bitti{background:var(--green-soft);color:var(--green);}
.st-tekrar{background:var(--yellow-soft);color:var(--yellow);}

/* Heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;}
.heat .cell{width:13px;height:13px;border-radius:3px;background:var(--bg-3);}
.heat-wrap{overflow-x:auto;padding-bottom:6px;}
.heat-legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-faint);}
.heat-legend .cell{width:12px;height:12px;border-radius:3px;}

/* Konu satırı */
.topic{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border-soft);border-radius:10px;background:var(--bg-3);margin-bottom:7px;}
.topic .drag{cursor:grab;color:var(--text-faint);font-size:15px;}
.topic .tname{flex:1;font-size:13.5px;font-weight:500;}
.topic.dragging{opacity:.4;}
.topic.dragover{border-color:var(--accent);}

/* Timer */
.timer-ring{width:230px;height:230px;margin:0 auto;position:relative;}
.timer-time{position:absolute;inset:0;display:grid;place-content:center;text-align:center;}
.timer-time .t{font-size:46px;font-weight:800;font-family:var(--mono);letter-spacing:1px;}
.timer-time .m{font-size:12.5px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:1px;}

/* Badge */
.badge{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid var(--border-soft);border-radius:12px;background:var(--bg-3);}
.badge .emo{font-size:30px;filter:grayscale(1);opacity:.4;}
.badge.earned{border-color:var(--accent);background:var(--accent-soft);}
.badge.earned .emo{filter:none;opacity:1;}
.badge .bt{font-size:13.5px;font-weight:700;}
.badge .bd{font-size:11.5px;color:var(--text-dim);}

/* Planner */
.planner{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.pl-day{background:var(--bg-2);border:1px solid var(--border);border-radius:10px;padding:9px;min-height:120px;}
.pl-day h4{margin:0 0 8px;font-size:12px;text-align:center;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
.pl-day.today{border-color:var(--accent);}
.pl-item{background:var(--bg-3);border-left:3px solid var(--accent);border-radius:7px;padding:6px 8px;font-size:11.5px;margin-bottom:6px;cursor:grab;}
.pl-item .pt{font-weight:600;}
.pl-item.dragging{opacity:.4;}
.pl-day.dragover{background:var(--accent-soft);}

/* Empty state */
.empty{text-align:center;padding:36px 20px;color:var(--text-faint);}
.empty .e-ic{font-size:40px;opacity:.5;margin-bottom:10px;}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-3);border:1px solid var(--border);border-radius:30px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--text-dim);}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
.color-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;display:inline-block;}

.quote{font-size:16px;font-style:italic;line-height:1.6;}
.lvl-ring{width:54px;height:54px;flex-shrink:0;}

/* Panel üst kart (hero) */
.hero{background:linear-gradient(135deg,var(--accent-soft),transparent);padding:24px;}
.hero-lbl{font-size:13px;color:var(--text-dim);font-weight:600;letter-spacing:.2px;}
.hero-num{font-size:52px;font-weight:800;line-height:1.02;letter-spacing:-2px;margin-top:4px;}
.hero-num span{font-size:19px;font-weight:600;color:var(--text-dim);margin-left:8px;letter-spacing:0;}
.hero-sub{font-size:13px;color:var(--text-faint);margin-top:4px;}
.hero-quote{margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);
  font-style:italic;color:var(--text-dim);font-size:15.5px;line-height:1.65;}

.hide{display:none!important;}
.center{text-align:center;}
.mt{margin-top:16px;}.mb{margin-bottom:16px;}
canvas{max-width:100%;}

/* Responsive */
@media(max-width:860px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:none;box-shadow:var(--shadow);}
  .main{margin-left:0;}
  .menu-btn{display:grid;place-items:center;}
  .content{padding:16px;}
  .topbar{padding:11px 14px;}
  .planner{grid-template-columns:1fr;}
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;}
}
@media(max-width:560px){
  .stat .val{font-size:23px;}
  .timer-ring{width:200px;height:200px;}
  .timer-time .t{font-size:40px;}
}
/* Telefon çentiği / durum çubuğu güvenli alanı (tam ekran uygulama modunda) */
@supports(padding:max(0px)){
  .topbar{padding-top:max(13px,env(safe-area-inset-top));}
  .sidebar{padding-top:env(safe-area-inset-top);}
  .content{padding-bottom:max(22px,env(safe-area-inset-bottom));}
  #toasts{bottom:max(20px,env(safe-area-inset-bottom));}
}
/* ---- Alt gezinme çubuğu: S24 Ultra gibi uzun ekranlarda tek elle erişim ---- */
.botnav{display:none;}
@media(max-width:860px){
  .botnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:color-mix(in srgb,var(--bg-2) 92%,transparent);backdrop-filter:blur(14px);
    border-top:1px solid var(--border);justify-content:space-around;align-items:stretch;
    padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom));
  }
  .botnav button{
    flex:1;background:none;border:none;color:var(--text-faint);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    font-size:10.5px;font-weight:600;padding:5px 0 3px;border-radius:12px;
    min-height:50px;position:relative;transition:color .15s;
  }
  .botnav button .bic{font-size:21px;line-height:1;}
  .botnav button.active{color:var(--accent);}
  .botnav .bn-badge{position:absolute;top:1px;left:calc(50% + 4px);background:var(--red);color:#fff;
    font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:10px;display:grid;place-items:center;padding:0 3px;}
  .content{padding-bottom:calc(62px + env(safe-area-inset-bottom));}
  /* TÜM çok sütunlu bölümleri telefonda tek sütuna indir.
     minmax(0,1fr): geniş içerik (ısı haritası vb.) sütunu şişiremez → taşma biter */
  .content .grid{grid-template-columns:minmax(0,1fr) !important;}
  .grid-2{grid-template-columns:minmax(0,1fr) !important;}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  .content .grid > *{min-width:0;}
  /* dokunma hedeflerini büyüt */
  .icon-btn{padding:8px;font-size:16px;}
  .btn{padding:10px 15px;}
  .nav button{padding:12px 12px;}
}
/* ---- S24 Ultra & benzeri geniş-uzun telefonlar (≈384–480px CSS genişlik) ---- */
@media(max-width:600px){
  /* Telefon için büyük, ferah, nefes alan arayüz */
  body{font-size:16px;line-height:1.55;}
  .content{padding:18px 16px calc(78px + env(safe-area-inset-bottom));}
  .grid{gap:18px;}
  .mb{margin-bottom:18px;}
  .mt{margin-top:18px;}
  .card{padding:20px;border-radius:18px;}
  .card.pad-sm{padding:16px;}
  .card-h{margin-bottom:16px;}
  .card-h h3{font-size:17.5px;}
  .stat-grid{gap:16px;}
  .stat{padding:18px;}
  .stat .lab{font-size:13.5px;}
  .stat .val{font-size:30px;margin-top:9px;}
  .stat .sub{font-size:13px;margin-top:5px;}
  .topbar{padding:13px 15px;}
  .topbar h2{font-size:20px;}
  .tiny{font-size:13px;}
  .faint{font-size:inherit;}
  label{font-size:13.5px;}
  .btn{font-size:15px;padding:11px 16px;}
  .btn.sm{font-size:13.5px;padding:8px 12px;}
  input,select,textarea{padding:13px 14px;font-size:16px;}
  .seg button{padding:10px 16px;font-size:14.5px;}
  .quote{font-size:15.5px;}
  .pill,.tag{font-size:12.5px;}
  .modal{border-radius:20px 20px 0 0;}
  .modal-bg{padding:0;align-items:flex-end;}
  .modal-b{max-height:78vh;}
  .modal-h h3{font-size:18px;}
  .timer-ring{width:250px;height:250px;}
  .timer-time .t{font-size:50px;}
  .topic{flex-wrap:wrap;padding:11px 13px;}
  .topic .tname{flex:1 1 100%;font-size:15.5px;}
  .botnav button{font-size:11.5px;min-height:54px;}
  .botnav button .bic{font-size:24px;}
  th{font-size:13px;}
  td{padding:12px 10px;font-size:14.5px;}
}
@media(max-width:380px){
  .stat .val{font-size:26px;}
  .timer-ring{width:220px;height:220px;}
}
</style>
</head>
<body>
<div class="app">
  <!-- KENAR ÇUBUĞU -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">Y</div>
      <div>
        <h1>YKS Takip</h1>
        <small>Hedefe Doğru 2026</small>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="streak-pill">
        <span class="fire">🔥</span>
        <div>
          <b id="sideStreak">0</b> günlük seri<br>
          <span class="tiny faint" id="sideLevel">Seviye 1</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ANA -->

const todayKey = (d=new Date())=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const parseKey = k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const escapeHtml = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtDur(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  if(h>0)return h+"sa "+m+"dk"; if(m>0)return m+"dk"; return sec+"sn";}
function fmtClock(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
function daysBetween(a,b){return Math.round((parseKey(todayKey(b))-parseKey(todayKey(a)))/86400000);}
function fmtDate(k){const d=parseKey(k);return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"short",year:"numeric"});}

function load(){

    if(raw){S=JSON.parse(raw); migrate(); }
    else { S=defaultState(); save(); }
  }catch(e){ console.error(e); S=defaultState(); }
}
function migrate(){
  const d=defaultState();
  for(const k of Object.keys(d)) if(S[k]===undefined) S[k]=d[k];
  for(const k of Object.keys(d.goals)) if(S.goals[k]===undefined) S.goals[k]=d.goals[k];
  for(const k of Object.keys(d.settings)) if(S.settings[k]===undefined) S.settings[k]=d.settings[k];
  for(const k of Object.keys(d.gam)) if(S.gam[k]===undefined) S.gam[k]=d.gam[k];
}

/* ---------- Hesaplayıcılar ---------- */
function totalQuestions(s=S){return s.qlogs.reduce((a,q)=>a+q.correct+q.wrong+q.blank,0);}
function totalFocus(s=S){return s.sessions.reduce((a,x)=>a+x.focus,0);}
function doneTopics(s=S){return s.subjects.reduce((a,sub)=>a+sub.topics.filter(t=>t.status==="bitti").length,0);}
function allTopicsCount(s=S){return s.subjects.reduce((a,sub)=>a+sub.topics.length,0);}
function subjectById(id){return S.subjects.find(x=>x.id===id);}
function topicById(subId,tid){const s=subjectById(subId);return s&&s.topics.find(t=>t.id===tid);}

function focusOnDay(key){return S.sessions.filter(x=>x.date===key).reduce((a,x)=>a+x.focus,0);}
function questionsOnDay(key){return S.qlogs.filter(x=>x.date===key).reduce((a,x)=>a+x.correct+x.wrong+x.blank,0);}
function rangeKeys(days){const out=[];const now=new Date();for(let i=days-1;i>=0;i--){const d=new Date(now);d.setDate(now.getDate()-i);out.push(todayKey(d));}return out;}
function weekStart(d=new Date()){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function focusInRange(keys){return keys.reduce((a,k)=>a+focusOnDay(k),0);}
function questionsInRange(keys){return keys.reduce((a,k)=>a+questionsOnDay(k),0);}

function levelFromXp(xp){return Math.floor(Math.sqrt(xp/100))+1;}
function xpForLevel(lvl){return Math.pow(lvl-1,2)*100;}
function addXp(n,reason){
  S.gam.xp+=n;
  const nl=levelFromXp(S.gam.xp);
  if(nl>S.gam.level){S.gam.level=nl;toast("🎉 Seviye atladın! Seviye "+nl,"ok");}
  save();
}

/* Aktivite günü güncelle + seri */
function markActiveToday(){
  const tk=todayKey();
  if(S.gam.lastActive===tk) return;
  if(S.gam.lastActive){
    const diff=daysBetween(S.gam.lastActive,new Date());
    if(diff===1) S.gam.streak+=1;
    else if(diff>1) S.gam.streak=1;
  }else S.gam.streak=1;
  S.gam.lastActive=tk;
  S.gam.bestStreak=Math.max(S.gam.bestStreak,S.gam.streak);
  save();
}
function refreshStreak(){
  // gün geçtiyse ve bugün/dün aktif değilse seriyi sıfırla (görsel için)
  if(!S.gam.lastActive){return;}
  const diff=daysBetween(S.gam.lastActive,new Date());
  if(diff>1) S.gam.streak=0;
}

/* Başarım kontrolü */
function checkBadges(){
  let gained=[];
  for(const b of BADGES){
    if(!S.gam.badges.includes(b.id) && b.chk(S)){ S.gam.badges.push(b.id); gained.push(b); }
  }
  if(gained.length){ gained.forEach(b=>toast("🏆 Rozet kazandın: "+b.t,"ok")); addXp(50*gained.length); save(); }
  return gained;
}

/* ============================================================
   BASİT CANVAS GRAFİKLERİ (harici kütüphane yok)
   ============================================================ */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function setupCanvas(cv,w,h){
  const dpr=window.devicePixelRatio||1;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+"px";cv.style.height=h+"px";
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);return ctx;
}
function barChart(cv,labels,values,opts={}){
  const w=cv.clientWidth||cv.parentElement.clientWidth-2,h=opts.h||180;
  const ctx=setupCanvas(cv,w,h);
  const pad={l:34,r:8,t:12,b:24};
  const max=Math.max(1,...values);
  const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  ctx.strokeStyle=css("--border-soft");ctx.lineWidth=1;ctx.fillStyle=css("--text-faint");ctx.font="10px var(--sans)";
  for(let i=0;i<=4;i++){const y=pad.t+ch*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
    ctx.textAlign="right";ctx.fillText(Math.round(max*(4-i)/4),pad.l-5,y+3);}
  const n=values.length,gap=cw/n*0.28,bw=(cw/n)-gap;
  const lblStep=Math.max(1,Math.ceil(n/Math.max(1,Math.floor(cw/26)))); // dar ekranda etiketleri seyrelt
  values.forEach((v,i)=>{
    const x=pad.l+ (cw/n)*i + gap/2;
    const bh=ch*v/max;const y=pad.t+ch-bh;
    const grad=ctx.createLinearGradient(0,y,0,pad.t+ch);
    grad.addColorStop(0,opts.color||css("--accent"));grad.addColorStop(1,(opts.color2||css("--accent-2")));
    ctx.fillStyle=grad;roundRect(ctx,x,y,bw,Math.max(bh,1),4);ctx.fill();
    if(i%lblStep===0||i===n-1){
      ctx.fillStyle=css("--text-faint");ctx.font="9px var(--sans)";ctx.textAlign="center";
      ctx.fillText(labels[i],x+bw/2,h-9);
    }
  });
}
function lineChart(cv,labels,values,opts={}){
  const w=cv.clientWidth||cv.parentElement.clientWidth-2,h=opts.h||200;
  const ctx=setupCanvas(cv,w,h);
  const pad={l:34,r:10,t:14,b:24};
  const vmax=Math.max(1,...values,opts.min||0),vmin=Math.min(0,...values);
  const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  ctx.strokeStyle=css("--border-soft");ctx.lineWidth=1;ctx.fillStyle=css("--text-faint");ctx.font="10px var(--sans)";
  for(let i=0;i<=4;i++){const y=pad.t+ch*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();
    ctx.textAlign="right";ctx.fillText(Math.round(vmax-(vmax-vmin)*i/4),pad.l-5,y+3);}
  if(values.length===0)return;
  const xfor=i=>pad.l+(values.length===1?cw/2:cw*i/(values.length-1));
  const yfor=v=>pad.t+ch-ch*(v-vmin)/(vmax-vmin||1);
  // alan
  ctx.beginPath();values.forEach((v,i)=>{const x=xfor(i),y=yfor(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.lineTo(xfor(values.length-1),pad.t+ch);ctx.lineTo(xfor(0),pad.t+ch);ctx.closePath();
  const g=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);g.addColorStop(0,hexA(opts.color||css("--accent"),.28));g.addColorStop(1,hexA(opts.color||css("--accent"),0));
  ctx.fillStyle=g;ctx.fill();
  // çizgi
  ctx.beginPath();values.forEach((v,i)=>{const x=xfor(i),y=yfor(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.strokeStyle=opts.color||css("--accent");ctx.lineWidth=2.2;ctx.lineJoin="round";ctx.stroke();
  // rolling avg
  if(opts.avg){
    ctx.beginPath();opts.avg.forEach((v,i)=>{const x=xfor(i),y=yfor(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.strokeStyle=css("--yellow");ctx.lineWidth=1.6;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
  }
  // noktalar
  values.forEach((v,i)=>{const x=xfor(i),y=yfor(v);ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fillStyle=css("--bg-2");ctx.fill();ctx.strokeStyle=opts.color||css("--accent");ctx.lineWidth=2;ctx.stroke();});
  // x etiketleri (seyrek)
  ctx.fillStyle=css("--text-faint");ctx.font="9px var(--sans)";ctx.textAlign="center";
  const step=Math.ceil(labels.length/6);
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)ctx.fillText(l,xfor(i),h-9);});
}
function donutChart(cv,data,opts={}){ // data:[{label,value,color}]
  const size=opts.size||180;const ctx=setupCanvas(cv,size,size);
  const cx=size/2,cy=size/2,r=size/2-6,ir=r*0.6;
  const total=data.reduce((a,d)=>a+d.value,0)||1;
  let ang=-Math.PI/2;
  data.forEach(d=>{
    const a2=ang+Math.PI*2*d.value/total;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,ang,a2);ctx.closePath();ctx.fillStyle=d.color;ctx.fill();
    ang=a2;
  });
  ctx.globalCompositeOperation="destination-out";ctx.beginPath();ctx.arc(cx,cy,ir,0,7);ctx.fill();
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle=css("--text");ctx.font="700 20px var(--sans)";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(opts.center||"",cx,cy-6);
  ctx.fillStyle=css("--text-faint");ctx.font="10px var(--sans)";ctx.fillText(opts.sub||"",cx,cy+12);
}
function progressRing(cv,pct,opts={}){
  const size=opts.size||230;const ctx=setupCanvas(cv,size,size);
  const cx=size/2,cy=size/2,r=size/2-14;
  ctx.lineWidth=opts.w||14;ctx.lineCap="round";
  ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.strokeStyle=css("--bg-3");ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(pct,0,1));
  const g=ctx.createLinearGradient(0,0,size,size);g.addColorStop(0,opts.c1||css("--accent"));g.addColorStop(1,opts.c2||css("--accent-2"));
  ctx.strokeStyle=g;ctx.stroke();
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function hexA(hex,a){hex=hex.replace("#","");if(hex.length===3)hex=hex.split("").map(c=>c+c).join("");const n=parseInt(hex,16);return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

/* Zayıf konu analizi */
function weakTopics(limit=8){
  // konu bazında doğru/yanlış topla -> accuracy
  const map={};
  S.qlogs.forEach(q=>{
    const key=q.subjectId+"|"+q.topicId;
    if(!map[key])map[key]={subjectId:q.subjectId,topicId:q.topicId,c:0,w:0,b:0};
    map[key].c+=q.correct;map[key].w+=q.wrong;map[key].b+=q.blank;
  });
  let arr=Object.values(map).filter(m=>(m.c+m.w+m.b)>=5).map(m=>{
    const tot=m.c+m.w+m.b;return{...m,acc:m.c/tot,total:tot};
  });
  // mastery düşük olan konuları da ekle
  S.subjects.forEach(sub=>sub.topics.forEach(t=>{
    if(t.status==="tekrar"||(t.mastery>0&&t.mastery<50)){
      if(!arr.find(a=>a.topicId===t.id)) arr.push({subjectId:sub.id,topicId:t.id,acc:t.mastery/100,total:0,fromMastery:true});
    }
  }));
  arr.sort((a,b)=>a.acc-b.acc);
  return arr.slice(0,limit);
}
function renderWeak(el,limit){
  const w=weakTopics(limit);
  if(!w.length){el.innerHTML='<div class="empty"><div class="e-ic">🌱</div>Henüz yeterli veri yok.<br>Soru çözüp konu durumu girdikçe burası dolacak.</div>';return;}
  el.innerHTML=w.map(m=>{
    const sub=subjectById(m.subjectId);const t=topicById(m.subjectId,m.topicId);
    if(!sub||!t)return"";
    const pct=Math.round(m.acc*100);
    return `<div style="margin-bottom:11px"><div class="row" style="justify-content:space-between;margin-bottom:4px">
      <span class="tiny"><span class="color-dot" style="background:${sub.color}"></span> ${escapeHtml(t.name)} <span class="faint">· ${escapeHtml(sub.name)}</span></span>
      <span class="tiny" style="color:${pct<40?'var(--red)':pct<60?'var(--yellow)':'var(--green)'}">%${pct}${m.total?'':' (öz)'}</span></div>
      <div class="bar ${pct<40?'':pct<60?'yellow':'green'}"><i style="width:${pct}%;${pct<40?'background:linear-gradient(90deg,var(--red),#ff7b72)':''}"></i></div></div>`;
  }).join("");
}

/* Heatmap */
function renderHeatmap(el){
  const days=364;const keys=rangeKeys(days);
  const vals=keys.map(k=>focusOnDay(k));
  const max=Math.max(1,...vals);
  const lvl=v=>{if(v===0)return 0;const r=v/max;return r<0.25?1:r<0.5?2:r<0.75?3:4;};
  const colors=[css("--bg-3"),hexA(css("--accent"),.3),hexA(css("--accent"),.5),hexA(css("--accent"),.75),css("--accent")];
  // ay etiketleri
  let cells="";let monthLabels="";
  keys.forEach((k,i)=>{
    const v=vals[i];const d=parseKey(k);
    cells+=`<div class="cell" title="${fmtDate(k)}: ${fmtDur(v)}" style="background:${colors[lvl(v)]}"></div>`;
  });
  el.innerHTML=`<div class="heat-wrap"><div class="heat">${cells}</div></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><div class="heat-legend">Az ${colors.map(c=>`<span class="cell" style="background:${c}"></span>`).join("")} Çok</div></div>`;
}

function setupTopicDnD(){
  $$(".topic").forEach(row=>{
    row.ondragstart=e=>{dragTopic={tid:row.dataset.tid,sid:row.dataset.sid};row.classList.add("dragging");};
    row.ondragend=()=>{row.classList.remove("dragging");$$(".topic").forEach(r=>r.classList.remove("dragover"));};
    row.ondragover=e=>{e.preventDefault();if(dragTopic&&dragTopic.sid===row.dataset.sid&&dragTopic.tid!==row.dataset.tid)row.classList.add("dragover");};
    row.ondragleave=()=>row.classList.remove("dragover");
    row.ondrop=e=>{e.preventDefault();row.classList.remove("dragover");
      if(!dragTopic||dragTopic.sid!==row.dataset.sid)return;
      const sub=subjectById(row.dataset.sid);
      const from=sub.topics.findIndex(t=>t.id===dragTopic.tid);
      const to=sub.topics.findIndex(t=>t.id===row.dataset.tid);
      if(from<0||to<0)return;
      const[m]=sub.topics.splice(from,1);sub.topics.splice(to,0,m);save();renderSubjList();
    };
  });

let timer={running:false,mode:"work",remaining:0,total:0,subjectId:null,topicId:null,
  focusAccum:0,breakAccum:0,sessionFocus:0,sessionBreak:0,cycles:0,interval:null,startTs:null};
RENDER.timer=function(){
  const subs=S.subjects;
  $("#view").innerHTML=`
    <div class="grid" style="grid-template-columns:1fr 340px;gap:18px" id="timerGrid">
      <div class="card center">
        <div class="seg mb" id="modeSeg" style="display:inline-flex">
          <button data-m="work" class="${timer.mode==='work'?'active':''}">Odak (${S.settings.pomoWork}dk)</button>
          <button data-m="break" class="${timer.mode==='break'?'active':''}">Mola (${S.settings.pomoBreak}dk)</button>
        </div>
        <div class="timer-ring">
          <canvas id="ringCv"></canvas>
          <div class="timer-time"><div class="t" id="ringTime">${fmtClock(timer.remaining||S.settings.pomoWork*60)}</div><div class="m" id="ringMode">${timer.mode==='work'?'ODAK':'MOLA'}</div></div>
        </div>
        <div class="row" style="justify-content:center;margin-top:18px">
          <button class="btn primary" id="startBtn" style="min-width:120px">${timer.running?'⏸ Duraklat':'▶ Başlat'}</button>
          <button class="btn" id="resetBtn">↺ Sıfırla</button>
          <button class="btn ghost" id="logManual">+ Manuel</button>
        </div>
        <div class="row" style="justify-content:center;gap:24px;margin-top:18px">
          <div><div class="tiny faint">Bu seans odak</div><div style="font-size:18px;font-weight:700" id="sessFocus">${fmtDur(timer.sessionFocus)}</div></div>
          <div><div class="tiny faint">Mola</div><div style="font-size:18px;font-weight:700" id="sessBreak">${fmtDur(timer.sessionBreak)}</div></div>
          <div><div class="tiny faint">Tur</div><div style="font-size:18px;font-weight:700" id="sessCycles">${timer.cycles}</div></div>
        </div>
      </div>
      <div>
        <div class="card mb">
          <div class="card-h"><h3>Ne Çalışıyorsun?</h3></div>
          <div class="field"><label>Ders</label><select id="tmSubject"><option value="">— Seç —</option>${subs.map(s=>`<option value="${s.id}" ${timer.subjectId===s.id?'selected':''}>${escapeHtml(s.name)} (${s.exam.toUpperCase()})</option>`).join("")}</select></div>
          <div class="field"><label>Konu</label><select id="tmTopic"></select></div>
          <div class="tiny faint">Süre otomatik olarak bu ders/konuya kaydedilir.</div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Bugünkü Seanslar</h3></div>
          <div id="todaySessions"></div>
        </div>
      </div>
    </div>`;

  $$("#modeSeg button").forEach(b=>b.onclick=()=>{if(timer.running)return toast("Önce zamanlayıcıyı durdur","warn");setMode(b.dataset.m);});
  $("#startBtn").onclick=toggleTimer;
  $("#resetBtn").onclick=resetTimer;
  $("#logManual").onclick=manualLog;
  $("#tmSubject").onchange=()=>{timer.subjectId=$("#tmSubject").value||null;timer.topicId=null;fillTimerTopics();};
  fillTimerTopics();
  if(!timer.running&&timer.remaining===0)timer.remaining=S.settings.pomoWork*60;
  drawRing();renderTodaySessions();
};
function fillTimerTopics(){
  const sel=$("#tmTopic");if(!sel)return;
  const sub=subjectById(timer.subjectId);
  sel.innerHTML=`<option value="">— Genel —</option>`+(sub?sub.topics.map(t=>`<option value="${t.id}" ${timer.topicId===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join(""):"");
  sel.onchange=()=>timer.topicId=sel.value||null;
}
function setMode(m){
  timer.mode=m;timer.remaining=(m==="work"?S.settings.pomoWork:S.settings.pomoBreak)*60;
  if($("#ringMode")){$("#ringMode").textContent=m==="work"?"ODAK":"MOLA";}
  $$("#modeSeg button").forEach(b=>b.classList.toggle("active",b.dataset.m===m));
  drawRing();$("#ringTime").textContent=fmtClock(timer.remaining);
}
function drawRing(){
  const cv=$("#ringCv");if(!cv)return;
  const tot=(timer.mode==="work"?S.settings.pomoWork:S.settings.pomoBreak)*60;
  const pct=tot?1-(timer.remaining/tot):0;
  progressRing(cv,pct,{size:230,c1:timer.mode==="work"?css("--accent"):css("--green"),c2:timer.mode==="work"?css("--accent-2"):"#56d364"});
}
function toggleTimer(){
  if(timer.running){pauseTimer();}
  else{
    if(timer.mode==="work"&&!timer.subjectId){toast("Önce bir ders seç","warn");return;}
    timer.running=true;timer.startTs=Date.now();
    $("#startBtn").innerHTML="⏸ Duraklat";
    timer.interval=setInterval(tick,1000);
  }
}
function pauseTimer(){
  timer.running=false;clearInterval(timer.interval);
  if($("#startBtn"))$("#startBtn").innerHTML="▶ Başlat";
  commitElapsed();
}
function commitElapsed(){
  // odak/mola süresini biriktir (timer durunca veya tamamlanınca çağrılır)
}
function tick(){
  timer.remaining--;
  if(timer.mode==="work"){timer.sessionFocus++;timer.focusAccum++;}
  else{timer.sessionBreak++;timer.breakAccum++;}
  if($("#ringTime"))$("#ringTime").textContent=fmtClock(Math.max(0,timer.remaining));
  if($("#sessFocus"))$("#sessFocus").textContent=fmtDur(timer.sessionFocus);
  if($("#sessBreak"))$("#sessBreak").textContent=fmtDur(timer.sessionBreak);
  drawRing();
  // burnout uyarısı
  if(timer.mode==="work"&&timer.focusAccum>0&&timer.focusAccum%(S.settings.burnoutWarn*60)===0){
    toast("⚠️ "+S.settings.burnoutWarn+" dk aralıksız çalıştın. Kısa bir mola iyi gelir!","warn");
  }
  if(timer.remaining<=0)completePhase();
}
function completePhase(){
  clearInterval(timer.interval);timer.running=false;
  beep();
  if(timer.mode==="work"){
    // odak seansını kaydet
    saveSession(S.settings.pomoWork*60,0);
    timer.cycles++;
    markActiveToday();
    toast("✅ Odak tamamlandı! Mola zamanı.","ok");
    const longBreak=timer.cycles%S.settings.longEvery===0;
    setMode("break");
    if(longBreak)timer.remaining=S.settings.pomoLong*60;
  }else{
    toast("Mola bitti. Hadi devam! 💪","ok");
    saveBreak(timer.mode==="break"?(S.settings.pomoBreak*60):0);
    setMode("work");
  }
  if($("#startBtn"))$("#startBtn").innerHTML="▶ Başlat";
  if($("#sessCycles"))$("#sessCycles").textContent=timer.cycles;
  renderTodaySessions();updateSideInfo();buildNav();
}
function saveSession(focus,brk){
  S.sessions.push({id:uid(),date:todayKey(),subjectId:timer.subjectId,topicId:timer.topicId,focus,total:focus+brk,brk});
  // konu durumu otomatik çalışılıyor yap
  const t=topicById(timer.subjectId,timer.topicId);
  if(t&&t.status==="islenmedi"){t.status="calisiliyor";}
  addXp(Math.round(focus/60),"odak");
  save();checkBadges();
}
function saveBreak(sec){
  if(sec<=0)return;
  // mola süresini son seansa ekle (veya ayrı kayıt)
  const last=S.sessions.filter(x=>x.date===todayKey()).slice(-1)[0];
  if(last){last.brk+=sec;last.total+=sec;}
  save();
}
function resetTimer(){
  pauseTimer();
  setMode(timer.mode);
  if(timer.sessionFocus>0){
    openModal("Seansı Kaydet?",`<p>Bu turda <b>${fmtDur(timer.sessionFocus)}</b> odaklandın. Kaydetmek ister misin?</p>`,
      `<button class="btn ghost" id="discard">Hayır, sıfırla</button><button class="btn primary" id="saveSess">Evet, kaydet</button>`);
    $("#saveSess").onclick=()=>{if(timer.sessionFocus>0){saveSession(timer.sessionFocus,timer.sessionBreak);markActiveToday();}clearSession();closeModal();RENDER.timer();updateSideInfo();};
    $("#discard").onclick=()=>{clearSession();closeModal();RENDER.timer();};
  }
}
function clearSession(){timer.sessionFocus=0;timer.sessionBreak=0;timer.remaining=S.settings.pomoWork*60;timer.mode="work";}

function delSession(id){S.sessions=S.sessions.filter(s=>s.id!==id);save();renderTodaySessions();updateSideInfo();toast("Seans silindi");}
function beep(){
  if(!S.settings.sound)return;
  try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();const g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.frequency.value=660;o.type="sine";g.gain.setValueAtTime(.001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.3,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.6);
    o.start();o.stop(ac.currentTime+.6);}catch(e){}
}

  // bu hafta "bitti" yapılan konuları takip etmiyoruz tarihsel; yaklaşık: toplam bitti (basit)
  // daha anlamlı: bu hafta çalışılan konulardan bitti olanlar — basitçe toplam göster
  return doneTopics();
}
function estimateScore(){
  const tytE=[...S.exams].filter(e=>e.type==="tyt").sort((a,b)=>a.date.localeCompare(b.date));
  const aytE=[...S.exams].filter(e=>e.type==="ayt").sort((a,b)=>a.date.localeCompare(b.date));
  const tytNet=tytE.length?tytE.slice(-3).reduce((a,e)=>a+e.totalNet,0)/Math.min(3,tytE.length):0;
  const aytNet=aytE.length?aytE.slice(-3).reduce((a,e)=>a+e.totalNet,0)/Math.min(3,aytE.length):0;
  const w=S.goals.scoreWeights;
  // kaba YKS benzeri: 100 taban + ağırlıklı net
  const score=Math.round(100 + tytNet*(w.tytBase*7.5) + aytNet*(w.aytBase*7.5));
  let rankBand;
  if(score>=480)rankBand="İlk 1.000";
  else if(score>=460)rankBand="İlk 5.000";
  else if(score>=440)rankBand="İlk 20.000";
  else if(score>=420)rankBand="İlk 50.000";
  else if(score>=380)rankBand="İlk 150.000";
  else if(score>=300)rankBand="İlk 500.000";
  else rankBand="—";
  return{score:isFinite(score)?score:0,rankBand,tytNet,aytNet};
}

function reviewDone(id){
  const m=S.mistakes.find(x=>x.id===id);
  m.interval=Math.min(m.interval+1,SR_INTERVALS.length-1);
  const days=SR_INTERVALS[m.interval];
  const nd=new Date();nd.setDate(nd.getDate()+days);m.next=todayKey(nd);
  if(m.interval>=SR_INTERVALS.length-1){m.done=true;
    // konuyu bitti yap
    const t=topicById(m.subjectId,m.topicId);if(t&&t.status==="tekrar")t.status="bitti";
  }
  addXp(15);toast("👍 Tekrar kaydedildi. Sonraki: "+days+" gün sonra","ok");save();RENDER.mistakes();buildNav();
}

    else S.mistakes.push({id:uid(),date:todayKey(),subjectId:$("#miSub").value,topicId:$("#miTopic").value||null,text,cat:$("#miCat").value,interval:0,next:todayKey(),done:false});
    addXp(10);save();checkBadges();closeModal();RENDER.mistakes();buildNav();toast("Kaydedildi","ok");
  };
}
function delMistake(id){S.mistakes=S.mistakes.filter(m=>m.id!==id);save();RENDER.mistakes();buildNav();toast("Silindi");}

/* ---------------- PLANLAYICI ---------------- */
const DAYS=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
let dragPlan=null;
RENDER.planner=function(){
  const ws=weekStart();const weekKey=todayKey(ws);
  if(!S.planner[weekKey])S.planner[weekKey]={};
  const tIdx=(new Date().getDay()+6)%7;
  $("#view").innerHTML=`
    <div class="row wrap mb" style="justify-content:space-between">
      <div><div style="font-weight:700;font-size:15px">Bu Hafta</div><div class="tiny faint">${fmtDate(weekKey)} haftası · sürükle-bırak ile taşı</div></div>
      <button class="btn primary" id="addPlan">+ Plan Ekle</button>
    </div>
    <div class="planner" id="plannerGrid"></div>
    <div class="card mt"><div class="card-h"><h3>📖 Kaynak / Kitap Takibi</h3><div class="spacer"></div><button class="btn sm primary" id="addBook">+ Kitap</button></div><div id="bookList"></div></div>`;
  $("#addPlan").onclick=()=>editPlan(weekKey);
  $("#addBook").onclick=()=>editBook();
  renderPlanner(weekKey,tIdx);
  renderBooks();
};
function renderPlanner(weekKey,tIdx){
  const grid=$("#plannerGrid");const data=S.planner[weekKey];
  grid.innerHTML=DAYS.map((d,i)=>{
    const items=(data[i]||[]);
    return `<div class="pl-day ${i===tIdx?'today':''}" data-day="${i}">
      <h4>${d}</h4>
      ${items.map(it=>{const sub=subjectById(it.subjectId);const t=it.topicId?topicById(it.subjectId,it.topicId):null;
        return `<div class="pl-item" draggable="true" data-id="${it.id}" data-day="${i}" style="border-left-color:${sub?sub.color:'#888'}">
          <div class="pt">${sub?escapeHtml(sub.name):'?'}</div>
          ${t?`<div class="faint">${escapeHtml(t.name)}</div>`:''}
          ${it.slot?`<div class="faint">🕐 ${escapeHtml(it.slot)}</div>`:''}
          <div class="row" style="margin-top:3px"><button class="icon-btn" style="font-size:11px;padding:1px 3px" onclick="delPlan('${weekKey}',${i},'${it.id}')">✕</button></div>
        </div>`;}).join("")||'<div class="tiny faint center" style="padding:8px 0">—</div>'}
    </div>`;
  }).join("");
  // DnD
  $$(".pl-item").forEach(it=>{
    it.ondragstart=e=>{dragPlan={id:it.dataset.id,day:+it.dataset.day};it.classList.add("dragging");e.stopPropagation();};
    it.ondragend=()=>{it.classList.remove("dragging");$$(".pl-day").forEach(d=>d.classList.remove("dragover"));};
  });
  $$(".pl-day").forEach(day=>{
    day.ondragover=e=>{e.preventDefault();day.classList.add("dragover");};
    day.ondragleave=()=>day.classList.remove("dragover");
    day.ondrop=e=>{e.preventDefault();day.classList.remove("dragover");if(!dragPlan)return;
      const to=+day.dataset.day;const from=dragPlan.day;if(to===from)return;
      const arr=data[from]||[];const idx=arr.findIndex(x=>x.id===dragPlan.id);if(idx<0)return;
      const[m]=arr.splice(idx,1);if(!data[to])data[to]=[];data[to].push(m);save();renderPlanner(weekKey,(new Date().getDay()+6)%7);
    };
  });
}
function editPlan(weekKey){
  const subs=S.subjects;
  openModal("Plan Ekle",`
    <div class="grid-2">
      <div class="field"><label>Gün</label><select id="plDay">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select></div>
      <div class="field"><label>Saat (ops.)</label><input id="plSlot" placeholder="örn. 19:00-20:30"></div>
    </div>
    <div class="grid-2">
      <div class="field"><label>Ders</label><select id="plSub">${subs.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join("")}</select></div>
      <div class="field"><label>Konu</label><select id="plTopic"></select></div>
    </div>`,
    `<button class="btn ghost" onclick="closeModal()">İptal</button><button class="btn primary" id="plSave">Ekle</button>`);
  const fill=()=>{const sub=subjectById($("#plSub").value);$("#plTopic").innerHTML=`<option value="">— Genel —</option>`+sub.topics.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");};
  $("#plSub").onchange=fill;fill();
  $("#plSave").onclick=()=>{
    const day=+$("#plDay").value;if(!S.planner[weekKey][day])S.planner[weekKey][day]=[];
    S.planner[weekKey][day].push({id:uid(),subjectId:$("#plSub").value,topicId:$("#plTopic").value||null,slot:$("#plSlot").value.trim()});
    save();closeModal();RENDER.planner();toast("Plana eklendi","ok");
  };
}
function delPlan(weekKey,day,id){S.planner[weekKey][day]=S.planner[weekKey][day].filter(x=>x.id!==id);save();RENDER.planner();}
function editBook(id){
  const b=id?S.books.find(x=>x.id===id):null;const subs=S.subjects;
  openModal(b?"Kitabı Düzenle":"Kaynak Ekle",`
    <div class="field"><label>Ders</label><select id="bkSub">${subs.map(s=>`<option value="${s.id}" ${b&&b.subjectId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join("")}</select></div>
    <div class="field"><label>Kitap / Kaynak Adı</label><input id="bkName" value="${b?escapeHtml(b.name):''}" placeholder="Örn. 3D TYT Matematik Soru Bankası"></div>
    <div class="grid-2">
      <div class="field"><label>Şu anki sayfa / test</label><input id="bkPage" type="number" value="${b?b.page:0}"></div>
      <div class="field"><label>Toplam sayfa / test</label><input id="bkTotal" type="number" value="${b?b.total:0}" placeholder="ops."></div>
    </div>`,
    `<button class="btn ghost" onclick="closeModal()">İptal</button><button class="btn primary" id="bkSave">Kaydet</button>`);
  $("#bkSave").onclick=()=>{const name=$("#bkName").value.trim();if(!name){toast("Kaynak adı gir","warn");return;}
    if(b){b.subjectId=$("#bkSub").value;b.name=name;b.page=+$("#bkPage").value||0;b.total=+$("#bkTotal").value||0;}
    else S.books.push({id:uid(),subjectId:$("#bkSub").value,name,page:+$("#bkPage").value||0,total:+$("#bkTotal").value||0});
    save();closeModal();renderBooks();toast("Kaydedildi","ok");};
}
function renderBooks(){
  const el=$("#bookList");if(!el)return;
  if(!S.books.length){el.innerHTML='<div class="empty"><div class="e-ic">📖</div>Çalıştığın kitapları ekle, kaldığın yeri takip et.</div>';return;}
  el.innerHTML=S.books.map(b=>{const sub=subjectById(b.subjectId);const pct=b.total?clamp(b.page/b.total,0,1):0;
    return `<div style="padding:11px 0;border-bottom:1px solid var(--border-soft)">
      <div class="row" style="justify-content:space-between">
        <div><span class="tiny" style="font-weight:600"><span class="color-dot" style="background:${sub?sub.color:'#888'}"></span> ${escapeHtml(b.name)}</span><div class="tiny faint">${sub?escapeHtml(sub.name):''} · Sayfa/Test ${b.page}${b.total?' / '+b.total:''}</div></div>
        <div class="row"><button class="btn sm ghost" onclick="bumpBook('${b.id}')">+1</button><button class="icon-btn" onclick="editBook('${b.id}')">✏️</button><button class="icon-btn" onclick="delBook('${b.id}')">🗑️</button></div>
      </div>
      ${b.total?`<div class="bar mt" style="height:6px"><i style="width:${pct*100}%"></i></div>`:''}</div>`;
  }).join("");
}
function bumpBook(id){const b=S.books.find(x=>x.id===id);b.page++;save();renderBooks();}
function delBook(id){S.books=S.books.filter(b=>b.id!==id);save();renderBooks();}

  $$("#rangeSeg button").forEach(b=>b.onclick=()=>{statRange=+b.dataset.d;RENDER.stats();});
  const keys=rangeKeys(statRange);
  const labelF=k=>{const d=parseKey(k);return statRange<=7?DAYS[(d.getDay()+6)%7]:d.getDate();};
  barChart($("#stStudy"),keys.map(labelF),keys.map(k=>Math.round(focusOnDay(k)/60)),{h:190});
  barChart($("#stQ"),keys.map(labelF),keys.map(k=>questionsOnDay(k)),{h:190,color:css("--green"),color2:"#56d364"});
  // pie
  const subjTime={};S.sessions.filter(s=>keys.includes(s.date)).forEach(s=>{const id=s.subjectId||"other";subjTime[id]=(subjTime[id]||0)+s.focus;});
  const pieData=Object.entries(subjTime).map(([id,v])=>{const sub=subjectById(id);return{label:sub?sub.name:"Diğer",value:v,color:sub?sub.color:"#666"};}).sort((a,b)=>b.value-a.value);
  if(pieData.length){
    donutChart($("#stPie"),pieData,{center:fmtDur(pieData.reduce((a,d)=>a+d.value,0)).replace(/sa.*/,"sa"),sub:"toplam"});
    $("#stPieLegend").innerHTML=pieData.map(d=>`<div class="row" style="justify-content:space-between;margin-bottom:5px"><span class="tiny"><span class="color-dot" style="background:${d.color}"></span> ${escapeHtml(d.label)}</span><span class="tiny muted">${fmtDur(d.value)}</span></div>`).join("");
  }else{$("#stPie").parentElement.innerHTML='<div class="empty"><div class="e-ic">📊</div>Bu dönemde çalışma kaydı yok.</div>';}
  // completion
  const comp=S.subjects.map(s=>{const done=s.topics.filter(t=>t.status==="bitti").length;return{name:s.name,color:s.color,pct:s.topics.length?done/s.topics.length:0,done,total:s.topics.length};}).filter(c=>c.total>0).sort((a,b)=>b.pct-a.pct);
  $("#stCompletion").innerHTML=comp.map(c=>`<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between;margin-bottom:4px"><span class="tiny"><span class="color-dot" style="background:${c.color}"></span> ${escapeHtml(c.name)}</span><span class="tiny muted">${c.done}/${c.total} · %${Math.round(c.pct*100)}</span></div><div class="bar ${c.pct>=1?'green':''}"><i style="width:${c.pct*100}%;background:${c.color}"></i></div></div>`).join("")||'<div class="tiny faint center">Veri yok.</div>';

};

function saveSettings(){
  const s=S.settings;
  s.pomoWork=clamp(+$("#seWork").value||25,1,180);
  s.pomoBreak=clamp(+$("#seBreak").value||5,1,60);
  s.pomoLong=clamp(+$("#seLong").value||15,1,60);
  s.longEvery=clamp(+$("#seEvery").value||4,1,12);
  s.burnoutWarn=clamp(+$("#seBurn").value||120,30,600);
  s.sound=$("#seSound").checked;
  S.goals.examDate=$("#setExamDate").value||S.goals.examDate;
  if(!timer.running)timer.remaining=s.pomoWork*60;
  save();toast("Ayarlar kaydedildi","ok");
}
function presetPomo(w,b){$("#seWork").value=w;$("#seBreak").value=b;saveSettings();RENDER.settings();}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="yks-takip-yedek-"+todayKey()+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("Yedek indirildi ⬇️","ok");
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.subjects||!Array.isArray(data.subjects))throw new Error("Geçersiz dosya");
      openModal("İçe Aktar","<p>Mevcut verilerinin üzerine bu yedek yazılacak. Devam edilsin mi?</p>",
        `<button class="btn ghost" onclick="closeModal()">İptal</button><button class="btn primary" id="cfmImport">Evet, içe aktar</button>`);
      $("#cfmImport").onclick=()=>{S=data;migrate();saveNow();applyTheme();updateSideInfo();buildNav();closeModal();navigate("dashboard");toast("Veriler içe aktarıldı ✓","ok");};
    }catch(err){toast("Dosya okunamadı: "+err.message,"err");}
  };
  reader.readAsText(file);
  e.target.value="";
}

/* ============================================================
   PWA — Progressive Web App desteği
   (Service worker + yükleme istemi. Bir web adresinden (http/https)
    açıldığında tam PWA olarak çalışır; dosyadan açınca uygulama yine
    çevrimdışı tek dosya olarak sorunsuz çalışır.)
   ============================================================ */
let deferredPrompt=null;
function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  if(!location.protocol.startsWith("http")) return; // file:// güvenli köken değil
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault(); deferredPrompt=e;
  if(currentPage==="settings") RENDER.settings();
  toast("📲 Bu uygulama telefonuna yüklenebilir — Ayarlar'dan yükle","ok");
});
window.addEventListener("appinstalled",()=>{ deferredPrompt=null; toast("Uygulama yüklendi 🎉","ok"); if(currentPage==="settings")RENDER.settings(); });
async function doInstall(){
  if(!deferredPrompt){toast("Yükleme istemi yok — tarayıcı menüsünden 'Ana ekrana ekle' kullan","warn");return;}
  deferredPrompt.prompt();
  try{ await deferredPrompt.userChoice; }catch(e){}
  deferredPrompt=null; if(currentPage==="settings")RENDER.settings();
}
function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}

/* ============================================================
   BAŞLAT
   ============================================================ */
function init(){
  load();
  applyTheme();
  refreshStreak();
  updateSideInfo();
  buildNav();
  navigate("dashboard");
  checkBadges();
  // sayfa kapanırken kaydet
  window.addEventListener("beforeunload",saveNow);
  // her dakika seri/zaman kontrolü
  setInterval(()=>{updateSideInfo();},60000);
  registerSW();
}
// global erişim (onclick için)
Object.assign(window,{navigate,closeModal,editSubject,deleteSubject,addTopic,editTopic,
  delSession,delQLog,editExam,delExam,editMistake,delMistake,reviewDone,editMilestone,
  toggleMile,delMile,editPlan,delPlan,editBook,delBook,bumpBook,presetPomo});
init();
</script>
